<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <title>Newsroom Sign In - Shlok Marathi News CMS</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/admin.css?v=2.6.6">
    <script>try{const t=localStorage.getItem('admin_theme')||'light';document.documentElement.setAttribute('data-theme',t);document.documentElement.style.backgroundColor=t==='dark'?'#0b0f19':'#f8fafc';}catch(e){}</script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="auth-page">

    <div class="auth-wrapper">
        <div class="auth-header-strip">
            <a href="../index.html" class="auth-back-link">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
                <span>Live Portal</span>
            </a>
            <button type="button" class="auth-theme-toggle" id="auth-theme-btn" aria-label="Toggle theme">
                <svg class="sun-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
                <svg class="moon-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
            </button>
        </div>

        <div class="auth-card">
            <div class="auth-brand">
                <div class="auth-logo-badge">
                    <img src="../assits/shlokmrathi news logo.png" alt="Shlok Marathi News">
                    <span class="auth-pulse-dot" title="Newsroom CMS Online"></span>
                </div>
                <h1>Newsroom CMS</h1>
                <p>Authorized editorial &amp; administrative access</p>
            </div>

            <div id="login-alert" class="alert alert-error" style="display: none;"></div>

            <form id="admin-login-form">
                <div class="form-group">
                    <div class="form-label-row">
                        <label class="form-label" for="email">Staff Email / Username</label>
                        <span class="form-label-badge">Required</span>
                    </div>
                    <div class="input-icon-wrapper">
                        <span class="input-icon-prefix">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
                        </span>
                        <input type="email" id="email" class="form-input has-prefix" placeholder="admin@shlokmarathi.news" required autocomplete="username">
                    </div>
                </div>
                
                <div class="form-group">
                    <div class="form-label-row">
                        <label class="form-label" for="password">Workstation Password</label>
                        <span class="caps-warning" id="caps-warning" style="display: none;">Caps Lock ON</span>
                    </div>
                    <div class="input-icon-wrapper">
                        <span class="input-icon-prefix">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                        </span>
                        <input type="password" id="password" class="form-input has-prefix has-suffix" placeholder="Enter security password" required autocomplete="current-password">
                        <button type="button" class="input-icon-suffix-btn" id="toggle-password" aria-label="Toggle password visibility" tabindex="-1">
                            <svg id="eye-icon-show" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
                            <svg id="eye-icon-hide" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" x2="22" y1="2" y2="22"/></svg>
                        </button>
                    </div>
                </div>

                <div class="form-extras-row">
                    <label class="remember-checkbox-label">
                        <input type="checkbox" id="remember-me" checked>
                        <span>Keep me signed in</span>
                    </label>
                    <a href="mailto:support@shlokmarathi.news?subject=Admin%20Access%20Recovery" class="auth-link">Need access?</a>
                </div>

                <button type="submit" class="btn btn-primary btn-auth-submit" id="login-btn">
                    <span class="spinner" id="login-spinner" style="display: none;"></span>
                    <span id="login-btn-text">Sign In to Newsroom</span>
                </button>
            </form>

            <div class="auth-demo-badge">
                <div class="demo-badge-info">
                    <span class="demo-badge-tag">Demo Staff Access</span>
                    <span class="demo-badge-creds">admin@shlokmarathi.news &bull; admin123</span>
                </div>
                <button type="button" class="demo-autofill-btn" id="autofill-demo-btn">
                    Quick Fill
                </button>
            </div>
        </div>
    </div>

    <script src="js/admin-supabase.js?v=2.6.2"></script>
    <script src="js/admin-auth.js?v=2.6.4"></script>
</body>
</html>
